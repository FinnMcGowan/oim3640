<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Price Lookup</title>
</head>
<body>
    <h1>Stock Price Lookup</h1>
    <form action="{{ url_for('ticker_post') }}" method="post">
        <input type="text" name="symbol" placeholder="Enter stock symbol (for example AAPL)" value="{{ symbol or '' }}" required>
        <button type="submit">Submit</button>
    </form>

    {% if error %}
        <p style="color: #b00020;">{{ error }}</p>
    {% endif %}

    {% if price is not none %}
        <p>Current price of <strong>{{ symbol.upper() }}</strong>: <strong>${{ '%.2f'|format(price) }}</strong></p>
    {% endif %}
</body>
</html>
